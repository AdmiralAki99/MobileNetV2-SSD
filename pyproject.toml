[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilenetv2-ssd"
version = "0.1.0"
description = "MobileNetV2-SSD object detection pipeline"
requires-python = ">=3.10"

dependencies = [
  "tensorflow==2.17.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "mypy",
]

onnx-export = [
  "onnxruntime>=1.17.0",
  "tf2onnx>=1.16.0",
  "onnx>=1.15.0",
]

cloud = [
  "boto3>=1.34.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["notebooks", ".venvs", "ref", "demo_runs", "runs", "exported_model"]

[tool.ruff.lint]
ignore = ["E501", "E402"]   # line-length (black's job), import-not-at-top

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405", "F821"]   # tests legitimately use `import *`

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -m 'not integration and not regression'"
markers = [
  "unit: fast, deterministic unit tests",
  "integration: slower tests that touch multiple components",
  "regression: tests that lock down previously-broken behavior"
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
warn_return_any = false

[tool.black]
line-length = 120
extend-exclude = '''
/(
  \.venvs
  | notebooks
  | exported_model
)/
'''
