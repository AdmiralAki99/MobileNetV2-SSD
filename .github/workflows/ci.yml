name: CI

on:
  pull_request:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint + Typecheck + Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: |
          ruff check .

      - name: Black (format check)
        run: |
          black --check .

      - name: Mypy (type check)
        continue-on-error: true
        run: |
          mypy src

      - name: Pytest (unit)
        run: |
          pytest tests/unit -m unit -q

  integration:
    name: Integration Tests (optional)
    runs-on: ubuntu-latest
    needs: [lint-type-test]
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (integration)
        run: |
          pytest -m integration -q

  regression:
    name: Regression Tests (optional)
    runs-on: ubuntu-latest
    needs: [lint-type-test]
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (regression)
        run: |
          pytest -m regression -q

  build-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [lint-type-test]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push' # Temporary dev testing, will remove once verified and tested

    strategy:
      matrix:
        include:
          - image: mobilenetv2-ssd
            dockerfile: docker/Dockerfile
          - image: mobilenetv2-ssd-etl
            dockerfile: docker/Dockerfile.etl
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{matrix.dockerfile}}
          push: true
          tags: |
            admiralaki/${{ matrix.image }}:latest
            admiralaki/${{ matrix.image }}:${{ github.sha }}
