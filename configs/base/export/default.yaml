# Export configuration

export:
  save_final_checkpoint: true
  save_best_checkpoint: true
  export_saved_model: true
  export_onnx: false
  export_tflite: false
  precisions: [fp32, fp16, int8]
  int8_all: true

promotion:
  min_map: 0.5

github:
  registry: "you/model-registry"
  tag_pattern: "{experiment_id}-{fingerprint}"
  
