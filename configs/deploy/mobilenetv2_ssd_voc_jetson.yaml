model_name: mobilenetv2-ssd
experiment_path: configs/experiments/exp002_cloud_run.yaml 
engine_path: /opt/models/mobilenetv2_ssd_voc_fp16.engine

deploy:
  saved_model_path: exported_model/saved_model
  onnx_path: exported_model/model.onnx
  quantized_onnx_path: exported_model/model_int8.onnx

  input:
    size: [300, 300, 3]
    format: "NHWC"
    color_space: "RGB"
    mean: [0.485, 0.456, 0.406] 
    std: [0.229, 0.224, 0.225] 


  priors:
    variances: [0.1, 0.2]

  post_processing:
    score_threshold: 0.65       # raise for cleaner visualisation; lower to 0.01 for mAP eval
    nms_iou_threshold: 0.5
    max_detections: 20
    per_class_top_k: 100

  classes:
    num_classes: 21
    root: "${DATA_ROOT:-datasets}/VOCdevkit/labels/voc_labels.txt"
    use_sigmoid: false

  runtime:
    precision: "FP16"
    batch_size: 1
    opset: 17

  